<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공부 플래너 beta 1.3</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#121212;--panel:#1a1a1a;--chip:#262626;--bd:#2c2c2c;--tx:#ececec;--mu:#8e8e8e;--ac:#ececec;--onac:#121212;--hh:44px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px 'Segoe UI','Malgun Gothic',sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:none;border:1px solid var(--bd);border-radius:6px;padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
button:hover{border-color:var(--mu)}
button.pri{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:600}
button.ic{padding:4px 7px}
button[disabled]{opacity:.35;cursor:default}
input,select{background:var(--chip);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;width:100%}
i.ti{font-size:18px}
.top{background:var(--panel);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;align-items:center;gap:10px;height:53px}
.top .sp{flex:1}.mu{color:var(--mu)}.sm{font-size:13px}
.main{display:flex;height:calc(100vh - 53px)}
.side{width:300px;border-right:1px solid var(--bd);padding:16px;display:flex;flex-direction:column;gap:18px;flex-shrink:0;overflow-y:auto}
.cont{flex:1;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px;overflow:auto}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:14px}
.h{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:8px}
.timer{text-align:center}
.time{font-size:48px;font-weight:600;letter-spacing:1px;margin:4px 0}
.task{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.task .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.done .t{color:var(--mu);text-decoration:line-through}
.cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--mu);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--onac)}
.done .cb{background:var(--ac);border-color:var(--ac)}.cb i{font-size:12px}
.add{border:1px dashed var(--bd);color:var(--mu);border-radius:6px;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;background:none;width:100%}
.ddr{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;cursor:pointer;border-bottom:1px solid var(--bd)}
.ddr b{font-size:18px}
.wkwrap{flex:1;display:flex;flex-direction:column;min-height:440px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar .tr{flex:1;height:8px;background:var(--bd);border-radius:4px}.bar .fl{height:8px;background:var(--ac);border-radius:4px}
.seg{display:flex}.seg button{border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
/* 월 달력 */
.mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;color:var(--mu);font-size:13px;text-align:center;margin-bottom:6px}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(92px,1fr);gap:6px}
.cell{border:1px solid var(--bd);border-radius:8px;padding:6px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:0}
.cell:hover{border-color:var(--mu)}.cell.out{opacity:.4}.cell.today{border:1.5px solid var(--ac)}.cell.over{background:var(--chip)}
.cell .dn{font-size:14px;margin-bottom:2px;width:max-content;padding:0 4px;border-radius:4px}
.cell.today .dn{font-weight:600;background:var(--ac);color:var(--onac)}
.chipt{background:var(--chip);border-radius:4px;padding:3px 6px;font-size:13px;cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipt.done{color:var(--mu);text-decoration:line-through}
.chipt .tm{color:var(--mu);margin-right:4px}
.more{font-size:12px;color:var(--mu);padding:0 6px}.more:hover{color:var(--tx)}
/* 주 보기(시간대) */
.tlwrap{flex:1;display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:10px;overflow:auto;min-height:0}
.tlin{display:flex;flex-direction:column;flex:1;min-height:0;min-width:640px}
.tlrow{display:grid;grid-template-columns:48px repeat(7,minmax(0,1fr));flex-shrink:0}
.tlhd>div{padding:6px;text-align:center;border-left:1px solid var(--bd);border-bottom:1px solid var(--bd);font-size:14px}
.tlhd>div:first-child{border-left:0}
.tlhd .today{font-weight:600}.tlhd .today span{background:var(--ac);color:var(--onac);border-radius:4px;padding:1px 6px}
.tlad>div{padding:4px;border-left:1px solid var(--bd);border-bottom:1px solid var(--bd);min-height:34px;display:flex;flex-direction:column;gap:3px}
.tlad>div:first-child{border-left:0;color:var(--mu);font-size:12px}
.tlad .over,.tlcol.over{background:var(--chip)}
.tlscroll{flex:1;min-height:0;overflow-y:auto}
.tlbody{display:grid;grid-template-columns:48px repeat(7,minmax(0,1fr))}
.tlhrs div{height:var(--hh);font-size:12px;color:var(--mu);text-align:right;padding-right:6px;transform:translateY(-8px)}
.tlcol{position:relative;border-left:1px solid var(--bd);height:calc(var(--hh)*24);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),var(--bd) calc(var(--hh) - 1px),var(--bd) var(--hh));cursor:pointer}
.ev{position:absolute;background:var(--chip);border:1px solid var(--mu);border-left:3px solid var(--ac);border-radius:4px;padding:2px 5px;font-size:13px;overflow:hidden;cursor:grab;line-height:1.25}
.ev.done{color:var(--mu);text-decoration:line-through}
.ev .tm{color:var(--mu);font-size:12px;display:block}
textarea{width:100%;background:var(--chip);border:1px solid var(--bd);border-radius:6px;padding:8px;color:var(--tx);font:13px/1.5 'Segoe UI','Malgun Gothic',sans-serif;resize:vertical}
.timer .seg button{flex:1;justify-content:center;white-space:nowrap;padding:4px 2px}
.pre{display:flex;gap:4px;justify-content:center;margin-top:8px}
.pre button{padding:2px 8px;font-size:13px}.pre input{width:64px;padding:2px 6px}
.task[draggable=true]{cursor:grab}.task .pl{padding:2px 5px;margin-left:2px}
#space{position:fixed;inset:0;z-index:60;background:#05060f;display:none}
#space canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.spui{position:absolute;left:0;right:0;bottom:0;padding:0 16px 30px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
#sp_sub{color:#8791c2;font-size:14px;letter-spacing:2px}
#sp_t{color:#e4e9fb;font-size:clamp(40px,7vw,68px);font-weight:300;letter-spacing:6px;line-height:1.1}
#sp_q{color:#aab4dc;font-size:clamp(15px,2vw,19px);max-width:min(740px,88vw);min-height:28px;transition:opacity .35s;margin-top:4px}
.spb{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.spb button{background:transparent;border:0;color:#8791c2;letter-spacing:2px;font-size:13px;padding:6px 4px}
.spb button:hover{color:#dbe1fa}.spb i.ti{font-size:15px}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:16px;width:min(360px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.two{display:flex;gap:8px}.two>div{flex:1}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--onac);padding:8px 14px;border-radius:8px;font-weight:600;display:none;z-index:20}
@media(max-width:1000px){.chipt .tm{display:none}}
@media(max-width:700px){.top{gap:6px;padding:8px 10px}.top b{white-space:nowrap;font-size:15px}.top .mu.sm{display:none}#sync{font-size:0;padding:3px 6px}#sync i{font-size:18px}.main{flex-direction:column;height:auto}.side{width:auto;border-right:0;border-bottom:1px solid var(--bd);overflow:visible}.cont{overflow:visible}.mgrid{grid-auto-rows:minmax(70px,auto)}.tlwrap{height:70vh;flex:none}.wkwrap{min-height:0}}
</style>
</head>
<body>
<div class="top">
  <i class="ti ti-notebook" style="font-size:22px"></i><b>공부 플래너</b><span class="mu sm">beta 1.3</span>
  <span class="sp"></span>
  <button class="ic" id="undo" title="되돌리기 (Ctrl+Z)"><i class="ti ti-arrow-back-up"></i></button>
  <button class="ic" id="redo" title="다시 실행 (Ctrl+Y)"><i class="ti ti-arrow-forward-up"></i></button>
  <span class="mu sm" id="steps" title="되돌릴 수 있는 단계 수"></span>
  <span class="sm" id="sync" style="border:1px solid var(--bd);border-radius:6px;padding:3px 8px;display:flex;align-items:center;gap:4px"></span>
  <button class="ic" id="gear" title="설정"><i class="ti ti-settings"></i></button>
</div>
<div class="main">
  <div class="side">
    <div class="card timer">
      <div class="seg" style="margin-bottom:10px"><button id="m_focus">집중</button><button id="m_timer">타이머</button><button id="m_sw">스톱워치</button></div>
      <select id="ttask" title="할 일을 고르면 끝난 시간이 그 과목 공부시간에 쌓여"></select>
      <select id="tsub" title="공부할 과목" style="margin-top:6px"></select>
      <div class="pre" id="tpre"><button data-m="25">25분</button><button data-m="50">50분</button><button data-m="90">90분</button><input id="tmin" type="number" min="1" max="600" title="직접 입력 (분)"></div>
      <div class="time" id="time">25:00</div>
      <div style="display:flex;gap:6px;justify-content:center">
        <button class="pri" id="tgo"><i class="ti ti-player-play"></i><span>시작</span></button>
        <button class="ic" id="treset" title="처음으로"><i class="ti ti-refresh"></i></button>
        <button class="ic" id="topen" title="공부 화면 열기"><i class="ti ti-stars"></i></button>
      </div>
      <div class="mu sm" style="margin-top:6px" id="tinfo"></div>
    </div>
    <div>
      <div class="h"><i class="ti ti-checklist"></i>오늘 할 일 <span class="mu sm" id="todaylbl" style="font-weight:400"></span></div>
      <div id="todaylist"></div>
      <button class="add" id="addtoday"><i class="ti ti-plus"></i>할 일 추가</button>
    </div>
    <div>
      <button class="add" id="aibtn" style="color:var(--tx)"><i class="ti ti-sparkles"></i>AI 계획 도우미</button>
    </div>
    <div>
      <div class="h"><i class="ti ti-flag"></i>D-day<span style="flex:1"></span><button class="ic" id="addexam" title="시험 추가"><i class="ti ti-plus"></i></button></div>
      <div id="dd"></div>
      <div class="ddr" style="cursor:default"><span><i class="ti ti-flame" style="vertical-align:-3px"></i> 연속 공부</span><b id="streak"></b></div>
    </div>
    <div>
      <div class="h"><i class="ti ti-chart-bar"></i>이번 주 과목별 공부시간</div>
      <div id="stats"></div>
    </div>
  </div>
  <div class="cont">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button class="ic" id="prev" title="이전"><i class="ti ti-chevron-left"></i></button>
      <b id="callbl" style="font-size:20px;min-width:150px;text-align:center"></b>
      <button class="ic" id="next" title="다음"><i class="ti ti-chevron-right"></i></button>
      <button id="gotoday">오늘</button>
      <span style="flex:1"></span>
      <span class="mu sm" id="hint"></span>
      <div class="seg"><button id="vmonth">월</button><button id="vweek">주</button></div>
    </div>
    <div class="wkwrap" id="cal"></div>
  </div>
</div>

<dialog id="dtask">
  <b id="dtitle">할 일</b>
  <label>내용</label><input id="f_title" maxlength="80">
  <label>과목</label><select id="f_sub"></select>
  <label>날짜</label><input id="f_date" type="date">
  <div class="two"><div><label>시작 시간 (비우면 종일)</label><input id="f_time" type="time"></div><div><label>길이(분)</label><input id="f_min" type="number" min="0" step="5"></div></div>
  <div class="row"><button id="f_del" style="margin-right:auto"><i class="ti ti-trash"></i>삭제</button><button id="f_cancel">취소</button><button class="pri" id="f_ok">저장</button></div>
</dialog>
<dialog id="dai" style="width:min(540px,94vw)">
  <b><i class="ti ti-sparkles" style="vertical-align:-3px"></i> AI 계획 도우미</b>
  <label>1. 어떤 계획이 필요해? (비워도 돼)</label><input id="ai_goal" placeholder="예: 중간고사까지 수학 위주로, 평일 3시간">
  <label>2. 아래 글을 복사해서 Claude 같은 AI에 붙여넣어</label>
  <textarea id="ai_out" readonly rows="7"></textarea>
  <div style="margin-top:6px"><button id="ai_copy"><i class="ti ti-copy"></i>복사</button></div>
  <label>3. AI가 준 답을 여기에 붙여넣어</label>
  <textarea id="ai_in" rows="5" placeholder='{"tasks":[ ... ]}'></textarea>
  <div class="sm mu" id="ai_msg" style="margin-top:6px"></div>
  <div class="row"><button id="ai_close">닫기</button><button class="pri" id="ai_add">일정 넣기</button></div>
</dialog>
<dialog id="dexam">
  <b id="etitle">시험 D-day</b>
  <label>이름</label><input id="e_name" maxlength="30">
  <label>날짜</label><input id="e_date" type="date">
  <div class="row"><button id="e_del" style="margin-right:auto"><i class="ti ti-trash"></i>삭제</button><button id="e_cancel">취소</button><button class="pri" id="e_ok">저장</button></div>
</dialog>
<dialog id="dset">
  <b>설정</b>
  <label>집중 시간(분)</label><input id="s_focus" type="number" min="1" max="120">
  <label>휴식 시간(분)</label><input id="s_rest" type="number" min="1" max="60">
  <label>과목 (쉼표로 구분)</label><input id="s_subs">
  <label>공부 화면 테마</label><select id="s_theme"></select>
  <label>공부 화면 문구</label><select id="s_quote"></select>
  <label>동기화</label>
  <div id="s_acct" class="sm mu"></div>
  <div style="display:flex;gap:6px;margin-top:6px"><button id="s_login"><i class="ti ti-brand-google"></i>구글로 로그인</button><button id="s_logout">로그아웃</button></div>
  <label>백업 / 로그</label>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><button id="s_exp"><i class="ti ti-download"></i>파일로 저장</button><button id="s_imp"><i class="ti ti-upload"></i>파일 불러오기</button><button id="s_log"><i class="ti ti-copy"></i>로그 복사</button></div>
  <input type="file" id="s_file" accept=".json" style="display:none">
  <div class="row"><button id="s_cancel">닫기</button><button class="pri" id="s_ok">저장</button></div>
</dialog>
<div id="space">
  <canvas id="sc"></canvas>
  <div class="spui">
    <div id="sp_sub"></div>
    <div id="sp_t">25:00</div>
    <div id="sp_q"></div>
    <div class="spb"><button id="sp_pause"><span>일시정지</span></button><button id="sp_next"><i class="ti ti-sparkles"></i>다른 말</button><button id="sp_end">끝내기</button><button id="sp_close">닫기</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initSpace, SCENES, QUOTE_SETS } from './space.js';
const KEY='studyplanner.state.v1', LOGKEY='studyplanner.log.v1', VKEY='studyplanner.view.v1';
const $=id=>document.getElementById(id);

/* ---------- 로그 ---------- */
let logs=[]; try{logs=JSON.parse(localStorage.getItem(LOGKEY)||'[]')}catch(e){}
function log(m){const l=new Date().toISOString().slice(11,19)+' '+m;logs.push(l);logs=logs.slice(-300);console.log('[plan]',m);try{localStorage.setItem(LOGKEY,JSON.stringify(logs))}catch(e){}}
window.addEventListener('error',e=>log('ERROR '+e.message));

/* ---------- 상태 ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>ds(new Date());
function fresh(){return{v:1,updatedAt:0,tasks:[],exams:[],sessions:[],subjects:['수학','영어','국어'],focus:25,rest:5,quoteMode:'good',spaceTheme:'cosmos'}}
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r){S={...fresh(),...JSON.parse(r)};log('불러옴 tasks='+S.tasks.length)}}catch(e){log('저장본 깨짐, 기본값으로 시작: '+e.message)}
let undoS=[],redoS=[];
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){log('저장 실패 '+e.message)}pushRemote()}
function commit(fn){undoS.push(JSON.stringify(S));if(undoS.length>100)undoS.shift();redoS=[];fn();save();render()}
function undo(){if(!undoS.length)return;redoS.push(JSON.stringify(S));S=JSON.parse(undoS.pop());save();render()}
function redo(){if(!redoS.length)return;undoS.push(JSON.stringify(S));S=JSON.parse(redoS.pop());save();render()}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}

/* ---------- 보기 상태 ---------- */
let view='month',monOff=0,weekOff=0,tlScroll=8*44;
try{const v=localStorage.getItem(VKEY);if(v==='week'||v==='month')view=v}catch(e){}
const DOW=['일','월','화','수','목','금','토'];
const HH=44;
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function weekStart(){return addDays(mondayOf(new Date()),weekOff*7)}
function fmtMin(m){return m>=60?Math.floor(m/60)+'h '+pad(m%60)+'m':m+'m'}
const byTime=(a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99');
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
function goWeekOf(k){view='week';weekOff=Math.round((mondayOf(pd(k))-mondayOf(new Date()))/(7*864e5));try{localStorage.setItem(VKEY,view)}catch(e){}render()}

/* ---------- 화면 ---------- */
function taskEl(t){
  const e=document.createElement('div');e.className='task'+(t.done?' done':'');
  e.innerHTML='<span class="cb"><i class="ti ti-check"></i></span><span class="t"></span><span class="mu sm"></span><button class="ic pl" title="이 할 일로 타이머 시작"><i class="ti ti-player-play"></i></button>';
  e.querySelector('.t').textContent=(t.subject?'['+t.subject+'] ':'')+t.title;
  e.children[2].textContent=t.time?t.time:(t.min?fmtMin(t.min):'');
  e.children[0].onclick=ev=>{ev.stopPropagation();commit(()=>{t.done=!t.done})};
  e.children[3].onclick=ev=>{ev.stopPropagation();startForTask(t)};
  e.draggable=true;e.title='끌어서 달력의 날짜·시간대에 넣기';
  e.ondragstart=ev=>{ev.dataTransfer.setData('text/plain',t.id)};
  e.onclick=()=>openTask(t);
  return e;
}
function chipEl(t,cls){
  const e=document.createElement('div');e.className=cls+(t.done?' done':'');e.draggable=true;
  e.title=(t.time?t.time+' ':'')+(t.subject?'['+t.subject+'] ':'')+t.title;
  if(cls==='chipt'){e.innerHTML='<span class="tm"></span><span></span>';e.children[0].textContent=t.time||'';e.children[1].textContent=(t.subject?t.subject+' ':'')+t.title;if(!t.time)e.children[0].remove()}
  e.ondragstart=ev=>{ev.dataTransfer.setData('text/plain',t.id)};
  e.onclick=ev=>{ev.stopPropagation();openTask(t)};
  return e;
}
function moveTask(id,date,time){

function lanes(list){
  const items=list.map(t=>({t,s:toMin(t.time),e:toMin(t.time)+Math.max(t.min||60,30),lane:0,n:1})).sort((a,b)=>a.s-b.s);
  let cl=[],clEnd=-1,ends=[];
  const fin=()=>{cl.forEach(x=>x.n=Math.max(1,ends.length));cl=[];ends=[]};
  items.forEach(it=>{
    if(it.s>=clEnd)fin();
    let l=ends.findIndex(e=>e<=it.s);if(l<0){l=ends.length;ends.push(0)}
    ends[l]=it.e;it.lane=l;cl.push(it);clEnd=Math.max(clEnd,it.e);
  });
  fin();return items;
}

  let obj;
  const a=s.indexOf('{'),b=s.lastIndexOf('}'),a2=s.indexOf('['),b2=s.lastIndexOf(']');
  try{obj=JSON.parse(a>=0&&b>a?s.slice(a,b+1):s)}catch(e){if(a2>=0&&b2>a2)obj=JSON.parse(s.slice(a2,b2+1));else throw e}
  const arr=(Array.isArray(obj)?obj:(obj&&obj.tasks))||[];
  const ok=[];let bad=0;
  arr.slice(0,200).forEach(r=>{
    const title=r&&typeof r.title==='string'?r.title.trim().slice(0,80):'';
    const okDate=r&&/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')&&ds(pd(r.date))===r.date;
    if(!title||!okDate){bad++;return}
    let time='';const m=/^(\d{1,2}):(\d{2})$/.exec(r.time||'');
    if(m&&+m[1]<24&&+m[2]<60)time=pad(+m[1])+':'+m[2];
    ok.push({id:uid(),done:false,title,subject:typeof r.subject==='string'?r.subject.trim():'',date:r.date,time,min:Math.max(0,parseInt(r.min)||0)});
  });
  return{ok,bad};
}
$('aibtn').onclick=()=>{$('ai_out').value=aiPrompt($('ai_goal').value);$('ai_msg').textContent='';$('dai').showModal()};
$('ai_goal').oninput=()=>{$('ai_out').value=aiPrompt($('ai_goal').value)};
$('ai_close').onclick=()=>$('dai').close();
$('ai_copy').onclick=async()=>{
  const t=$('ai_out').value;
  try{await navigator.clipboard.writeText(t);toast('복사했어. AI에 붙여넣어')}
  catch(e){$('ai_out').select();toast(document.execCommand('copy')?'복사했어. AI에 붙여넣어':'글을 직접 선택해서 복사해줘')}
};
$('ai_add').onclick=()=>{
  const txt=$('ai_in').value;if(!txt.trim()){$('ai_msg').textContent='AI가 준 답을 먼저 붙여넣어줘';return}
  let r;try{r=parsePlan(txt)}catch(e){$('ai_msg').textContent='답을 읽을 수 없어. AI가 준 JSON 전체를 붙여넣었는지 확인해줘';log('AI 답 파싱 실패 '+e.message);return}
  if(!r.ok.length){$('ai_msg').textContent='넣을 일정이 없어'+(r.bad?' (형식이 맞지 않는 것 '+r.bad+'개)':'');return}
  commit(()=>{r.ok.forEach(t=>{S.tasks.push(t);if(t.subject&&!S.subjects.includes(t.subject))S.subjects.push(t.subject)})});
  log('AI 일정 '+r.ok.length+'개 추가, 제외 '+r.bad);
  $('ai_in').value='';$('dai').close();toast(r.ok.length+'개 넣었어'+(r.bad?' ('+r.bad+'개는 형식 오류로 제외)':'')+'. Ctrl+Z로 되돌릴 수 있어');
};

/* ---------- 설정 / 백업 ---------- */
$('gear').onclick=()=>{$('s_theme').value=S.spaceTheme||'cosmos';$('s_quote').value=S.quoteMode||'good';$('s_focus').value=S.focus;$('s_rest').value=S.rest;$('s_subs').value=S.subjects.join(', ');updateAcct();$('dset').showModal()};
$('s_cancel').onclick=()=>$('dset').close();
$('s_ok').onclick=()=>{
  const f=Math.max(1,parseInt($('s_focus').value)||25),r=Math.max(1,parseInt($('s_rest').value)||5);
  const subs=$('s_subs').value.split(',').map(x=>x.trim()).filter(Boolean);
  commit(()=>{S.focus=f;S.rest=r;S.subjects=subs.length?subs:S.subjects;S.spaceTheme=$('s_theme').value;S.quoteMode=$('s_quote').value});
  if(!tm.running){tmin.focus=S.focus;if(tm.mode==='focus')tm.left=(tm.phase==='rest'?S.rest:S.focus)*60}$('dset').close();tickTimer();
};
$('s_exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='study-planner-backup.json';a.click();log('백업 저장')};
$('s_imp').onclick=()=>$('s_file').click();
$('s_file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());commit(()=>{S={...fresh(),...d}});toast('불러왔어');log('백업 불러옴')}catch(err){toast('파일을 읽을 수 없어');log('불러오기 실패 '+err.message)}e.target.value=''};
$('s_log').onclick=async()=>{try{await navigator.clipboard.writeText(logs.join('\n'));toast('로그 복사됨')}catch(e){toast('복사 실패')}};

/* ---------- 동기화 (파이어베이스) ---------- */
let fb=null,user=null,pushT=null,applying=false;
function setSync(txt,icon){$('sync').innerHTML='<i class="ti ti-'+icon+'"></i>'+txt}
function updateAcct(){
  $('s_acct').textContent=!firebaseConfig?'동기화 설정이 아직 없어 (이 기기에만 저장 중)':user?user.email+' 로 동기화 중':'로그인하면 PC·폰이 같은 계획을 봐';
  $('s_login').style.display=firebaseConfig&&!user?'inline-flex':'none';$('s_logout').style.display=user?'inline-flex':'none';
}
async function pushRemote(){
  if(!fb||!user||applying)return;
  clearTimeout(pushT);setSync('저장 중','cloud-upload');
  pushT=setTimeout(async()=>{try{await fb.setDoc(fb.doc(fb.db,'users',user.uid),{data:JSON.stringify(S),updatedAt:S.updatedAt});setSync('동기화됨','check');log('원격 저장')}catch(e){setSync('동기화 오류','alert-triangle');log('원격 저장 실패 '+e.message)}},600);
}
async function initFirebase(){
  if(!firebaseConfig){setSync('이 기기에만 저장','device-floppy');return}
  try{
    const B='https://www.gstatic.com/firebasejs/10.14.1/';
    const [A,Au,Fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=A.initializeApp(firebaseConfig),auth=Au.getAuth(app),db=Fs.getFirestore(app);
    fb={db,doc:Fs.doc,setDoc:Fs.setDoc,auth,Au};
    $('s_login').onclick=()=>Au.signInWithPopup(auth,new Au.GoogleAuthProvider()).catch(e=>{toast('로그인 실패');log('로그인 실패 '+e.code)});
    $('s_logout').onclick=()=>Au.signOut(auth);
    setSync('로그인 필요','cloud-off');
    Au.onAuthStateChanged(auth,u=>{
      user=u;updateAcct();if(!u){setSync('로그인 필요','cloud-off');return}
      log('로그인 '+u.email);setSync('불러오는 중','cloud-download');
      Fs.onSnapshot(Fs.doc(db,'users',u.uid),snap=>{
        if(!snap.exists()){save();return}
        const r=snap.data();
        if(r.updatedAt>S.updatedAt){applying=true;try{S={...fresh(),...JSON.parse(r.data)};localStorage.setItem(KEY,JSON.stringify(S));render();log('원격에서 받음')}catch(e){log('원격 데이터 오류 '+e.message)}applying=false}
        else if(r.updatedAt<S.updatedAt){pushRemote()}
        setSync('동기화됨','check');
      },e=>{setSync('동기화 오류','alert-triangle');log('수신 오류 '+e.message)});
    });
  }catch(e){setSync('동기화 오류','alert-triangle');log('파이어베이스 시작 실패 '+e.message)}
}
render();initFirebase();log('시작 beta 1.3');
</script>

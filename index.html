<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공부 플래너 beta 1.0</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#121212;--panel:#1a1a1a;--chip:#262626;--bd:#2c2c2c;--tx:#ececec;--mu:#8e8e8e;--ac:#ececec;--onac:#121212}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px 'Segoe UI','Malgun Gothic',sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:none;border:1px solid var(--bd);border-radius:6px;padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
button:hover{border-color:var(--mu)}
button.pri{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:600}
button.ic{padding:4px 7px}
button[disabled]{opacity:.35;cursor:default}
input,select{background:var(--chip);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;width:100%}
i.ti{font-size:16px}
.top{background:var(--panel);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top .sp{flex:1}.mu{color:var(--mu)}.sm{font-size:12px}
.main{display:flex;min-height:calc(100vh - 46px)}
.side{width:260px;border-right:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:16px;flex-shrink:0}
.cont{flex:1;padding:14px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:12px}
.h{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:8px}
.timer{text-align:center}
.time{font-size:38px;font-weight:600;letter-spacing:1px;margin:4px 0}
.task{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;margin-bottom:6px;cursor:pointer}
.task .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.done .t{color:var(--mu);text-decoration:line-through}
.cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--mu);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--onac)}
.done .cb{background:var(--ac);border-color:var(--ac)}.cb i{font-size:12px}
.add{border:1px dashed var(--bd);color:var(--mu);border-radius:6px;padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;background:none;width:100%}
.dd{display:flex;gap:8px;flex-wrap:wrap}
.dd .card{flex:1;min-width:110px;padding:10px 12px;cursor:pointer}
.dd .n{font-size:22px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--bd);border-radius:8px;padding:6px;min-height:130px;display:flex;flex-direction:column;gap:4px}
.day.today{border:1.5px solid var(--ac)}.day.over{background:var(--chip)}
.day .dh{font-size:12px;color:var(--mu)}.day .dn{font-weight:600}
.chipt{background:var(--chip);border-radius:4px;padding:3px 5px;font-size:12px;cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipt.done{color:var(--mu);text-decoration:line-through}
.day .plus{margin-top:auto;color:var(--mu);cursor:pointer;text-align:center;opacity:.5}
.day:hover .plus{opacity:1}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar .tr{flex:1;height:6px;background:var(--bd);border-radius:3px}.bar .fl{height:6px;background:var(--ac);border-radius:3px}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:16px;width:min(360px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--onac);padding:8px 14px;border-radius:8px;font-weight:600;display:none;z-index:20}
@media(max-width:820px){.main{flex-direction:column}.side{width:auto;border-right:0;border-bottom:1px solid var(--bd)}.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="top">
  <i class="ti ti-notebook" style="font-size:20px"></i><b>공부 플래너</b><span class="mu sm">beta 1.0</span>
  <span class="sp"></span>
  <button class="ic" id="undo" title="되돌리기 (Ctrl+Z)"><i class="ti ti-arrow-back-up"></i></button>
  <button class="ic" id="redo" title="다시 실행 (Ctrl+Y)"><i class="ti ti-arrow-forward-up"></i></button>
  <span class="mu sm" id="steps" title="되돌릴 수 있는 단계 수"></span>
  <span class="sm" id="sync" style="border:1px solid var(--bd);border-radius:6px;padding:3px 8px;display:flex;align-items:center;gap:4px"></span>
  <button class="ic" id="gear" title="설정"><i class="ti ti-settings"></i></button>
</div>
<div class="main">
  <div class="side">
    <div class="card timer">
      <div class="mu sm" style="display:flex;justify-content:center;align-items:center;gap:6px"><i class="ti ti-clock"></i><span id="tmode">집중</span></div>
      <select id="tsub" title="공부할 과목"></select>
      <div class="time" id="time">25:00</div>
      <div style="display:flex;gap:6px;justify-content:center">
        <button class="pri" id="tgo"><i class="ti ti-player-play"></i><span>시작</span></button>
        <button class="ic" id="treset" title="처음으로"><i class="ti ti-refresh"></i></button>
      </div>
      <div class="mu sm" style="margin-top:6px" id="tinfo"></div>
    </div>
    <div>
      <div class="h"><i class="ti ti-checklist"></i>오늘 할 일 <span class="mu sm" id="todaylbl" style="font-weight:400"></span></div>
      <div id="todaylist"></div>
      <button class="add" id="addtoday"><i class="ti ti-plus"></i>할 일 추가</button>
    </div>
  </div>
  <div class="cont">
    <div class="dd" id="dd"></div>
    <div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <button class="ic" id="prev" title="이전 주"><i class="ti ti-chevron-left"></i></button>
        <b id="weeklbl"></b>
        <button class="ic" id="next" title="다음 주"><i class="ti ti-chevron-right"></i></button>
        <button id="thisweek">이번 주</button>
        <span class="sp" style="flex:1"></span>
        <span class="mu sm">카드를 끌어서 날짜 이동 · 클릭해서 수정</span>
      </div>
      <div class="week" id="week"></div>
    </div>
    <div class="card">
      <div class="h"><i class="ti ti-chart-bar"></i>이번 주 과목별 공부시간</div>
      <div id="stats"></div>
    </div>
  </div>
</div>

<dialog id="dtask">
  <b id="dtitle">할 일</b>
  <label>내용</label><input id="f_title" maxlength="80">
  <label>과목</label><select id="f_sub"></select>
  <label>날짜</label><input id="f_date" type="date">
  <label>예상 시간(분)</label><input id="f_min" type="number" min="0" step="5">
  <div class="row"><button id="f_del" style="margin-right:auto"><i class="ti ti-trash"></i>삭제</button><button id="f_cancel">취소</button><button class="pri" id="f_ok">저장</button></div>
</dialog>
<dialog id="dexam">
  <b id="etitle">시험 D-day</b>
  <label>이름</label><input id="e_name" maxlength="30">
  <label>날짜</label><input id="e_date" type="date">
  <div class="row"><button id="e_del" style="margin-right:auto"><i class="ti ti-trash"></i>삭제</button><button id="e_cancel">취소</button><button class="pri" id="e_ok">저장</button></div>
</dialog>
<dialog id="dset">
  <b>설정</b>
  <label>집중 시간(분)</label><input id="s_focus" type="number" min="1" max="120">
  <label>휴식 시간(분)</label><input id="s_rest" type="number" min="1" max="60">
  <label>과목 (쉼표로 구분)</label><input id="s_subs">
  <label>동기화</label>
  <div id="s_acct" class="sm mu"></div>
  <div style="display:flex;gap:6px;margin-top:6px"><button id="s_login"><i class="ti ti-brand-google"></i>구글로 로그인</button><button id="s_logout">로그아웃</button></div>
  <label>백업 / 로그</label>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><button id="s_exp"><i class="ti ti-download"></i>파일로 저장</button><button id="s_imp"><i class="ti ti-upload"></i>파일 불러오기</button><button id="s_log"><i class="ti ti-copy"></i>로그 복사</button></div>
  <input type="file" id="s_file" accept=".json" style="display:none">
  <div class="row"><button id="s_cancel">닫기</button><button class="pri" id="s_ok">저장</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
const KEY='studyplanner.state.v1', LOGKEY='studyplanner.log.v1';
const $=id=>document.getElementById(id);

/* ---------- 로그 ---------- */
let logs=[]; try{logs=JSON.parse(localStorage.getItem(LOGKEY)||'[]')}catch(e){}
function log(m){const l=new Date().toISOString().slice(11,19)+' '+m;logs.push(l);logs=logs.slice(-300);console.log('[plan]',m);try{localStorage.setItem(LOGKEY,JSON.stringify(logs))}catch(e){}}
window.addEventListener('error',e=>log('ERROR '+e.message));

/* ---------- 상태 ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>ds(new Date());
function fresh(){return{v:1,updatedAt:0,tasks:[],exams:[],sessions:[],subjects:['수학','영어','국어'],focus:25,rest:5}}
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r){S={...fresh(),...JSON.parse(r)};log('불러옴 tasks='+S.tasks.length)}}catch(e){log('저장본 깨짐, 기본값으로 시작: '+e.message)}
let undoS=[],redoS=[];
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){log('저장 실패 '+e.message)}pushRemote()}
function commit(fn){undoS.push(JSON.stringify(S));if(undoS.length>100)undoS.shift();redoS=[];fn();save();render()}
function undo(){if(!undoS.length)return;redoS.push(JSON.stringify(S));S=JSON.parse(undoS.pop());save();render()}
function redo(){if(!redoS.length)return;undoS.push(JSON.stringify(S));S=JSON.parse(redoS.pop());save();render()}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}

/* ---------- 화면 ---------- */
let weekOff=0;
const DOW=['일','월','화','수','목','금','토'];
function weekStart(){const d=new Date();d.setHours(0,0,0,0);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w+weekOff*7);return d}
function fmtMin(m){return m>=60?Math.floor(m/60)+'h '+pad(m%60)+'m':m+'m'}
function taskEl(t,cls){
  const e=document.createElement('div');e.className='task'+(t.done?' done':'');
  e.innerHTML='<span class="cb"><i class="ti ti-check"></i></span><span class="t"></span><span class="mu sm"></span>';
  e.querySelector('.t').textContent=(t.subject?'['+t.subject+'] ':'')+t.title;
  e.children[2].textContent=t.min?fmtMin(t.min):'';
  e.children[0].onclick=ev=>{ev.stopPropagation();commit(()=>{t.done=!t.done})};
  e.onclick=()=>openTask(t);
  return e;
}
function render(){
  $('undo').disabled=!undoS.length;$('redo').disabled=!redoS.length;
  $('steps').textContent=undoS.length?undoS.length+'단계':'';
  const td=today();$('todaylbl').textContent=(new Date().getMonth()+1)+'/'+new Date().getDate()+' '+DOW[new Date().getDay()];
  const tl=$('todaylist');tl.innerHTML='';
  S.tasks.filter(t=>t.date===td).forEach(t=>tl.appendChild(taskEl(t)));
  // D-day
  const dd=$('dd');dd.innerHTML='';
  const now=pd(td);
  S.exams.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{
    const n=Math.round((pd(x.date)-now)/864e5);
    const c=document.createElement('div');c.className='card';
    c.innerHTML='<div class="mu sm"><i class="ti ti-flag"></i> <span></span></div><div class="n"></div>';
    c.querySelector('span').textContent=x.name;c.querySelector('.n').textContent=n===0?'D-DAY':n>0?'D-'+n:'D+'+(-n);
    c.onclick=()=>openExam(x);dd.appendChild(c);
  });
  const st=document.createElement('div');st.className='card';
  st.innerHTML='<div class="mu sm"><i class="ti ti-flame"></i> 연속 공부</div><div class="n">'+streak()+'일</div>';dd.appendChild(st);
  const ad=document.createElement('div');ad.className='card';ad.style.cssText='display:flex;align-items:center;justify-content:center;color:var(--mu);border-style:dashed;min-width:90px;flex:0 0 auto';
  ad.innerHTML='<i class="ti ti-plus"></i>&nbsp;시험';ad.onclick=()=>openExam(null);dd.appendChild(ad);
  // 주간
  const ws=weekStart(),we=new Date(ws);we.setDate(we.getDate()+6);
  $('weeklbl').textContent=(ws.getMonth()+1)+'월 '+ws.getDate()+'일 – '+(we.getMonth()+1)+'월 '+we.getDate()+'일';
  const wk=$('week');wk.innerHTML='';
  for(let i=0;i<7;i++){
    const d=new Date(ws);d.setDate(d.getDate()+i);const k=ds(d);
    const c=document.createElement('div');c.className='day'+(k===td?' today':'');
    c.innerHTML='<div class="dh">'+DOW[d.getDay()]+'</div><div class="dn">'+d.getDate()+'</div>';
    S.tasks.filter(t=>t.date===k).forEach(t=>{
      const e=document.createElement('div');e.className='chipt'+(t.done?' done':'');e.draggable=true;
      e.textContent=(t.subject||'')+(t.subject?' ':'')+t.title;e.title=t.title;
      e.ondragstart=ev=>{ev.dataTransfer.setData('text/plain',t.id)};
      e.onclick=()=>openTask(t);c.appendChild(e);
    });
    const p=document.createElement('div');p.className='plus';p.innerHTML='<i class="ti ti-plus"></i>';p.title='이 날짜에 추가';p.onclick=()=>openTask(null,k);c.appendChild(p);
    c.ondragover=ev=>{ev.preventDefault();c.classList.add('over')};
    c.ondragleave=()=>c.classList.remove('over');
    c.ondrop=ev=>{ev.preventDefault();c.classList.remove('over');const t=S.tasks.find(x=>x.id===ev.dataTransfer.getData('text/plain'));if(t&&t.date!==k)commit(()=>{t.date=k;log('이동 '+t.title+' → '+k)})};
    wk.appendChild(c);
  }
  // 통계
  const a=ds(ws),b=ds(we),sum={};
  S.sessions.filter(s=>s.date>=a&&s.date<=b).forEach(s=>sum[s.subject||'기타']=(sum[s.subject||'기타']||0)+s.min);
  const keys=Object.keys(sum),mx=Math.max(1,...keys.map(k=>sum[k]));
  $('stats').innerHTML=keys.length?'':'<div class="mu sm">타이머로 공부하면 여기에 쌓여.</div>';
  keys.sort((x,y)=>sum[y]-sum[x]).forEach(k=>{
    const r=document.createElement('div');r.className='bar';
    r.innerHTML='<span style="width:44px"></span><div class="tr"><div class="fl" style="width:'+Math.round(sum[k]/mx*100)+'%"></div></div><span class="mu sm" style="width:56px;text-align:right">'+fmtMin(sum[k])+'</span>';
    r.firstChild.textContent=k;$('stats').appendChild(r);
  });
  // 과목 목록
  const cur=$('tsub').value;
  [$('tsub'),$('f_sub')].forEach(sel=>{const v=sel.value;sel.innerHTML='<option value="">과목 없음</option>'+S.subjects.map(x=>'<option>'+x+'</option>').join('');sel.value=v})
  if(cur)$('tsub').value=cur;
  tickTimer();
}
function streak(){
  const days=new Set([...S.sessions.map(s=>s.date),...S.tasks.filter(t=>t.done).map(t=>t.date)]);
  const d=new Date();if(!days.has(ds(d)))d.setDate(d.getDate()-1);
  let n=0;while(days.has(ds(d))){n++;d.setDate(d.getDate()-1)}return n;
}

/* ---------- 할 일 / 시험 대화상자 ---------- */
let editing=null;
function openTask(t,date){
  editing=t;$('dtitle').textContent=t?'할 일 수정':'할 일 추가';
  $('f_title').value=t?t.title:'';$('f_sub').value=t?t.subject||'':$('tsub').value;
  $('f_date').value=t?t.date:(date||today());$('f_min').value=t?t.min||'':'';
  $('f_del').style.visibility=t?'visible':'hidden';$('dtask').showModal();$('f_title').focus();
}
$('f_cancel').onclick=()=>$('dtask').close();
$('f_ok').onclick=()=>{
  const title=$('f_title').value.trim();if(!title){$('f_title').focus();return}
  const v={title,subject:$('f_sub').value,date:$('f_date').value||today(),min:parseInt($('f_min').value)||0};
  commit(()=>{if(editing)Object.assign(editing,v);else S.tasks.push({id:uid(),done:false,...v})});$('dtask').close();
};
$('f_del').onclick=()=>{commit(()=>{S.tasks=S.tasks.filter(x=>x!==editing)});$('dtask').close();toast('삭제했어. Ctrl+Z로 되돌릴 수 있어')};
$('dtask').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();$('f_ok').click()}});
$('addtoday').onclick=()=>openTask(null);
let editingE=null;
function openExam(x){editingE=x;$('etitle').textContent=x?'시험 수정':'시험 추가';$('e_name').value=x?x.name:'';$('e_date').value=x?x.date:'';$('e_del').style.visibility=x?'visible':'hidden';$('dexam').showModal();$('e_name').focus()}
$('e_cancel').onclick=()=>$('dexam').close();
$('e_ok').onclick=()=>{const name=$('e_name').value.trim(),date=$('e_date').value;if(!name||!date)return;commit(()=>{if(editingE){editingE.name=name;editingE.date=date}else S.exams.push({id:uid(),name,date})});$('dexam').close()};
$('e_del').onclick=()=>{commit(()=>{S.exams=S.exams.filter(x=>x!==editingE)});$('dexam').close()};

/* ---------- 주 이동 / 되돌리기 ---------- */
$('prev').onclick=()=>{weekOff--;render()};$('next').onclick=()=>{weekOff++;render()};$('thisweek').onclick=()=>{weekOff=0;render()};
$('undo').onclick=undo;$('redo').onclick=redo;
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  if(e.ctrlKey&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
});

/* ---------- 타이머 ---------- */
let tm={mode:'focus',running:false,end:0,left:S.focus*60,sub:''};
const fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.4)}catch(e){}}
function tickTimer(){
  let left=tm.running?Math.max(0,Math.round((tm.end-Date.now())/1000)):tm.left;
  $('time').textContent=fmt(left);document.title=(tm.running?fmt(left)+' · ':'')+'공부 플래너';
  $('tmode').textContent=tm.mode==='focus'?'집중':'휴식';
  $('tgo').innerHTML=tm.running?'<i class="ti ti-player-pause"></i><span>일시정지</span>':'<i class="ti ti-player-play"></i><span>시작</span>';
  const n=S.sessions.filter(s=>s.date===today()).length;
  $('tinfo').textContent=S.focus+'분 집중 · '+S.rest+'분 휴식 · 오늘 '+n+'회 완료';
  if(tm.running&&left<=0)finishTimer();
}
function finishTimer(){
  beep();tm.running=false;
  if(tm.mode==='focus'){commit(()=>{S.sessions.push({id:uid(),date:today(),subject:tm.sub,min:S.focus})});log('집중 완료 '+tm.sub);tm.mode='rest';tm.left=S.rest*60;toast('집중 끝! 쉬어가자')}
  else{tm.mode='focus';tm.left=S.focus*60;toast('휴식 끝')}
  tickTimer();
}
$('tgo').onclick=()=>{
  if(tm.running){tm.left=Math.max(0,Math.round((tm.end-Date.now())/1000));tm.running=false}
  else{tm.sub=$('tsub').value;tm.end=Date.now()+tm.left*1000;tm.running=true}
  tickTimer();
};
$('treset').onclick=()=>{tm.running=false;tm.mode='focus';tm.left=S.focus*60;tickTimer()};
setInterval(()=>{if(tm.running)tickTimer()},500);

/* ---------- 설정 / 백업 ---------- */
$('gear').onclick=()=>{$('s_focus').value=S.focus;$('s_rest').value=S.rest;$('s_subs').value=S.subjects.join(', ');updateAcct();$('dset').showModal()};
$('s_cancel').onclick=()=>$('dset').close();
$('s_ok').onclick=()=>{
  const f=Math.max(1,parseInt($('s_focus').value)||25),r=Math.max(1,parseInt($('s_rest').value)||5);
  const subs=$('s_subs').value.split(',').map(x=>x.trim()).filter(Boolean);
  commit(()=>{S.focus=f;S.rest=r;S.subjects=subs.length?subs:S.subjects});
  if(!tm.running){tm.left=(tm.mode==='focus'?S.focus:S.rest)*60}$('dset').close();
};
$('s_exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='study-planner-backup.json';a.click();log('백업 저장')};
$('s_imp').onclick=()=>$('s_file').click();
$('s_file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());commit(()=>{S={...fresh(),...d}});toast('불러왔어');log('백업 불러옴')}catch(err){toast('파일을 읽을 수 없어');log('불러오기 실패 '+err.message)}e.target.value=''};
$('s_log').onclick=async()=>{try{await navigator.clipboard.writeText(logs.join('\n'));toast('로그 복사됨')}catch(e){toast('복사 실패')}};

/* ---------- 동기화 (파이어베이스) ---------- */
let fb=null,user=null,pushT=null,applying=false;
function setSync(txt,icon){$('sync').innerHTML='<i class="ti ti-'+icon+'"></i>'+txt}
function updateAcct(){
  $('s_acct').textContent=!firebaseConfig?'동기화 설정이 아직 없어 (이 기기에만 저장 중)':user?user.email+' 로 동기화 중':'로그인하면 PC·폰이 같은 계획을 봐';
  $('s_login').style.display=firebaseConfig&&!user?'inline-flex':'none';$('s_logout').style.display=user?'inline-flex':'none';
}
async function pushRemote(){
  if(!fb||!user||applying)return;
  clearTimeout(pushT);setSync('저장 중','cloud-upload');
  pushT=setTimeout(async()=>{try{await fb.setDoc(fb.doc(fb.db,'users',user.uid),{data:JSON.stringify(S),updatedAt:S.updatedAt});setSync('동기화됨','check');log('원격 저장')}catch(e){setSync('동기화 오류','alert-triangle');log('원격 저장 실패 '+e.message)}},600);
}
async function initFirebase(){
  if(!firebaseConfig){setSync('이 기기에만 저장','device-floppy');return}
  try{
    const B='https://www.gstatic.com/firebasejs/10.14.1/';
    const [A,Au,Fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=A.initializeApp(firebaseConfig),auth=Au.getAuth(app),db=Fs.getFirestore(app);
    fb={db,doc:Fs.doc,setDoc:Fs.setDoc,auth,Au};
    $('s_login').onclick=()=>Au.signInWithPopup(auth,new Au.GoogleAuthProvider()).catch(e=>{toast('로그인 실패');log('로그인 실패 '+e.code)});
    $('s_logout').onclick=()=>Au.signOut(auth);
    setSync('로그인 필요','cloud-off');
    Au.onAuthStateChanged(auth,u=>{
      user=u;updateAcct();if(!u){setSync('로그인 필요','cloud-off');return}
      log('로그인 '+u.email);setSync('불러오는 중','cloud-download');
      Fs.onSnapshot(Fs.doc(db,'users',u.uid),snap=>{
        if(!snap.exists()){save();return}
        const r=snap.data();
        if(r.updatedAt>S.updatedAt){applying=true;try{S={...fresh(),...JSON.parse(r.data)};localStorage.setItem(KEY,JSON.stringify(S));render();log('원격에서 받음')}catch(e){log('원격 데이터 오류 '+e.message)}applying=false}
        else if(r.updatedAt<S.updatedAt){pushRemote()}
        setSync('동기화됨','check');
      },e=>{setSync('동기화 오류','alert-triangle');log('수신 오류 '+e.message)});
    });
  }catch(e){setSync('동기화 오류','alert-triangle');log('파이어베이스 시작 실패 '+e.message)}
}
render();initFirebase();log('시작 beta 1.0');
</script>
</body>
</html>
